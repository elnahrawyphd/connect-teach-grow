<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Connect, Teach and Grow: a pocket toolkit for EFL student teachers (Ain Shams University).">
<meta name="theme-color" content="#1463e0">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Connect, Teach and Grow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one-column phone-first "network" app: home with search, five section tiles, one screen per tool */
:root{
  --ink:#123b37; --bg:#eef9f6; --card:#ffffff; --line:#c3e3dc; --muted:#4a6563;
  --hero1:#ffc83d; --hero2:#ff7a4d; --onHero:#3a2008;
  --plan:#1463e0; --teach:#05874a; --check:#d9480f; --grow:#8b3ff0; --learn:#b06e00;
  --accent:#ffb000; --ok:#1f8a5b; --warn:#b4541a; --soft:#dcefeb; --onTile:#ffffff;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#dff0ee; --bg:#0c1d1d; --card:#132a2a; --line:#244040; --muted:#9dbab7; --hero1:#9a6614; --hero2:#9a4330; --onHero:#fff4e2;
  --plan:#6aa8e8; --teach:#4fc48d; --check:#f0965a; --grow:#c597ea; --learn:#e6b94a;
  --accent:#e6b94a; --ok:#4fc48d; --warn:#f0965a; --soft:#183434; --onTile:#0f1a22; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#dff0ee; --bg:#0c1d1d; --card:#132a2a; --line:#244040; --muted:#9dbab7; --hero1:#9a6614; --hero2:#9a4330; --onHero:#fff4e2;
  --plan:#6aa8e8; --teach:#4fc48d; --check:#f0965a; --grow:#c597ea; --learn:#e6b94a;
  --accent:#e6b94a; --ok:#4fc48d; --warn:#f0965a; --soft:#183434; --onTile:#0f1a22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
html[data-size="lg"] body{font-size:20px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
a{color:var(--plan)}
button{font:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.i.sm{width:17px;height:17px}
.i.lg{width:30px;height:30px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);padding:0;min-width:0}
.brand svg{width:40px;height:40px;flex:0 0 auto}
.brand b{font-family:var(--display);font-size:1.3rem;font-weight:800;line-height:1.1;text-align:left}
.topr{display:flex;align-items:center;gap:6px}
.ghost{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:.88rem}
.ghost.on{border-color:var(--accent);background:var(--soft)}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;color:var(--muted);border-radius:999px;padding:4px 9px;background:var(--soft);white-space:nowrap}
.sync.on{color:var(--ok)}
.sync.off{color:var(--warn)}
@media (max-width:480px){.brand b{font-size:.95rem}.brand svg{width:34px;height:34px}.topr{gap:4px}.ghost{padding:6px 7px}.ghost .gt{display:none}.sync .st{display:none}}
@media (max-width:400px){.brand b{font-size:.95rem}.brand{gap:6px}}
/* demo banner */
.demo{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;border-radius:12px;padding:8px 12px;margin-bottom:10px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--grow) 18%,var(--card)) 0 12px,var(--card) 12px 24px);border:2px solid var(--grow);font-weight:700}
/* week banner */
.week{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--plan),var(--grow));color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.week::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22) 0 18%,transparent 19%) 0 0/50px 50px;pointer-events:none}
.week>*{position:relative;z-index:1}
.week .label{color:#fff;opacity:.9}
.week .row button{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:0;border-radius:10px;padding:8px 14px;font-weight:700}
.week .row button.alt{background:transparent;color:var(--onHero);border:1.5px solid var(--onHero)}
.week .when2{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.95rem}
.startb{display:flex;align-items:center;gap:12px;border:2px dashed var(--accent);border-radius:14px;padding:12px 14px;background:var(--card)}
.startb .txt{flex:1;min-width:0}
.startb .btn{background:var(--grow);color:var(--onTile)}
/* phrase of the day + PLN pick */
.qod{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:12px 14px}
.qod .q{font-family:var(--display);font-size:1.15rem;font-weight:600;line-height:1.3}
.qod .ic2{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:#1b1b1b;flex:0 0 auto}
.pick{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--teach) 10%,var(--card));border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pick .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:transparent;padding:12px 0}
.search input:focus-visible{outline:none}
.search:focus-within{outline:3px solid var(--accent);outline-offset:2px}
/* links */
.links{display:flex;flex-wrap:wrap;gap:8px}
.lkr{display:inline-flex;align-items:center;gap:8px;max-width:100%;text-decoration:none;font:inherit;font-size:.92rem;line-height:1.2;color:var(--ink);background:color-mix(in srgb,var(--c) 14%,var(--card));border:1.5px solid color-mix(in srgb,var(--c) 38%,var(--line));border-radius:999px;padding:5px 14px 5px 5px;text-align:left}
.lki{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:var(--onTile);flex:0 0 auto}
.lki .i{width:18px;height:18px}
.lkt{min-width:0}
.lkr.soon{border-style:dashed;opacity:.75}
.aut{display:block;font-size:.62rem;font-weight:700;color:var(--muted);line-height:1}
.gsc{display:block;font-size:.72rem;font-weight:700;color:var(--check)}
.lastt{display:block;font-size:.7rem;color:var(--muted);font-weight:400}
.upd{position:fixed;left:12px;right:12px;bottom:14px;z-index:60;display:flex;gap:10px;align-items:center;justify-content:center;background:var(--accent);color:#1b1b1b;border:0;border-radius:16px;padding:12px 16px;font:inherit;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.gm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gm button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.98rem;padding:8px 10px;text-align:left;line-height:1.25}
.gm button.sel{border-color:var(--plan);background:color-mix(in srgb,var(--plan) 14%,var(--card))}
.gm button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card));opacity:.85}
.gm button.no{border-color:var(--warn);animation:gshake .35s}
@keyframes gshake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.gm .gl{font-weight:700}
.fcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fc{min-height:120px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:10px;display:grid;place-items:center;text-align:center}
.fc .em{font-size:2.2rem;line-height:1}.fc b{font-size:1.1rem}.fc.back{background:color-mix(in srgb,var(--learn) 16%,var(--card));border-color:var(--learn)}
.gscore{text-align:center;font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--ok)}
.gname{font-family:var(--display);font-weight:800;font-size:1.05rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:15px;border-radius:2px;animation:cfall 2.3s ease-in forwards}
@keyframes cfall{to{transform:translateY(106vh) rotate(620deg)}}
.gm .gl{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,color-mix(in srgb,var(--plan) 16%,var(--card)),var(--card))}
.gm .gl .gi{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--plan);color:var(--onTile);flex:0 0 auto}
.gm .gl .gi .i{width:20px;height:20px}
.gm button[data-gr]{background:linear-gradient(135deg,color-mix(in srgb,var(--check) 10%,var(--card)),var(--card))}
.wheelwrap{position:relative;max-width:340px;margin:6px auto 0}
.wheel{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.wptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:34px;line-height:1;color:var(--warn);z-index:2;text-shadow:0 2px 4px rgba(0,0,0,.25)}
#pkRot{transition:transform 3.8s cubic-bezier(.12,.67,.15,1)}
.pkbig{text-align:center;font-family:var(--display);font-size:2.6rem;font-weight:800;min-height:1.4em;color:var(--grow)}
.pkbig.win{animation:pkw .6s ease-out}@keyframes pkw{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
details.own{border:1.5px dashed var(--line);border-radius:14px;padding:8px 12px;margin-top:8px}
details.own summary{cursor:pointer;font-weight:700}
.jtabs{display:flex;flex-wrap:wrap;gap:8px}
.jtabs button{flex:1 1 140px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:10px;display:flex;gap:8px;align-items:center;justify-content:center}
.jtabs button.on{border-color:var(--grow);background:color-mix(in srgb,var(--grow) 14%,var(--card))}
.jwords{display:flex;flex-wrap:wrap;gap:6px}.jwords span{background:color-mix(in srgb,var(--learn) 18%,var(--card));border-radius:999px;padding:4px 10px;font-size:.9rem}
.jout{white-space:pre-wrap}
.fbk{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;margin:6px 0;border:1.5px solid var(--line)}
.fbk.g{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-color:var(--ok)}
.fbk.y{background:color-mix(in srgb,var(--accent) 16%,var(--card));border-color:var(--accent)}
.fbk.b{background:color-mix(in srgb,var(--plan) 12%,var(--card));border-color:var(--plan)}
.fbk .i{flex:0 0 auto;width:26px;height:26px}
.mylinks{gap:10px;background:color-mix(in srgb,var(--teach) 9%,var(--card));border-color:color-mix(in srgb,var(--teach) 30%,var(--line))}
.lk{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.92rem;white-space:nowrap}
.lk.soon{color:var(--muted);border-style:dashed}
/* section tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:0;border-radius:16px;padding:14px;text-align:left;color:var(--onTile);display:flex;flex-direction:column;gap:4px;min-height:112px}
.tile b{font-family:var(--display);font-size:1.4rem;letter-spacing:.03em}
.tile span{font-size:.92rem;opacity:.95}
.tile.wide{grid-column:1/-1}
.t-plan{background:var(--plan)}.t-teach{background:var(--teach)}.t-check{background:var(--check)}.t-grow{background:var(--grow)}.t-learn{background:var(--learn)}
/* help chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:.95rem}
.chip.on{border-color:var(--accent);background:var(--soft)}
/* cards / panels */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--muted);padding:4px 0;font-size:.95rem;align-self:flex-start}
.head{display:flex;align-items:center;gap:10px}
.hico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--onTile);flex:0 0 auto}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;color:var(--ink);width:100%;text-decoration:none}
.item .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;color:var(--onTile)}
.item .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.item.locked .ico{opacity:.55}
.item.locked b{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.new{background:linear-gradient(120deg,#ff3d71,#ffb000);color:#fff;font-weight:800}
.item.newc{border:2px solid var(--nc);background:color-mix(in srgb,var(--nc) 10%,var(--card))}
.item.newc .ico{background:var(--nc)!important;color:#fff}
details.early{border:1px dashed var(--line);border-radius:14px;padding:6px 10px;background:var(--card)}
details.early summary{cursor:pointer;font-weight:700;color:var(--muted);padding:6px 2px;list-style:none;display:flex;align-items:center;gap:8px}
details.early summary::-webkit-details-marker{display:none}
details.early[open] summary{margin-bottom:8px}
.hcard{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--c) 10%,var(--card));border:2px solid var(--c);border-radius:16px;padding:12px 14px}
.hcard .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hcard .hico{background:var(--c);color:#fff}
.minifoot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.minifoot button{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.8rem;padding:4px 10px;display:inline-flex;align-items:center;gap:5px}
.pill.ok{color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.out{background:var(--soft);border-radius:12px;padding:14px;font-size:1.08rem;min-height:3em}
.tip{border-left:4px solid var(--accent);padding:8px 12px;background:var(--soft);border-radius:0 10px 10px 0}
.note{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;color:var(--muted)}
label{font-weight:700;font-size:.95rem}
select,input,textarea{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:96px}
.field{display:flex;flex-direction:column;gap:4px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:440px){.two{grid-template-columns:1fr}}
.abcd-key{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.abcd-key div{border-radius:10px;padding:8px 4px;text-align:center;font-size:.8rem;font-weight:700;background:var(--soft)}
.abcd-key div.on{outline:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--card))}
.abcd-key b{display:block;font-family:var(--display);font-size:1.5rem}
.abcd-key .i{display:block;margin:0 auto 2px}
.cA{color:var(--plan)}.cB{color:var(--teach)}.cC{color:var(--check)}.cD{color:var(--grow)}
.ok{color:var(--ok);font-weight:700}.warn{color:var(--warn);font-weight:700}
.alts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.alts div{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:.88rem;display:flex;gap:8px;align-items:flex-start}
@media (max-width:440px){.alts{grid-template-columns:1fr}}
/* preview */
.pv{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pv p{display:flex;gap:8px;align-items:flex-start}
/* visuals */
.vis{width:100%;max-width:420px;margin:0 auto;display:block}
.vis.wide{max-width:560px}
.vis text{font-family:var(--body);fill:var(--ink)}
.node{cursor:pointer}
.info{background:var(--soft);border-radius:12px;padding:12px 14px;min-height:4.2em}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{background:var(--c,var(--ink));color:var(--onTile);border-color:var(--c,var(--ink))}
.fb{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:8px 10px;font-size:.95rem}
.fb.good{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--ink)}
.fb.good .i{color:var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--warn) 14%,var(--card));color:var(--ink)}
.fb.bad .i{color:var(--warn)}
.exbox{border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.exl{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.exbox p{font-size:1.05rem;font-weight:700}
.guide{display:flex;flex-wrap:wrap;gap:6px}
.guide span{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;background:var(--soft);border-radius:99px;padding:4px 10px}
.guide b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#1b1b1b;font-size:.8rem}
.linkb{background:none;border:0;color:var(--plan);text-decoration:underline;padding:0;font-size:inherit}
.qcard{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.yn{display:flex;gap:8px}
.yn button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px}
.yn button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.yn button[style*="--c"].on{background:var(--c);border-color:var(--c);color:var(--onTile)}
.lvl{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;background:var(--plan);color:var(--onTile)}
.lvl b.big{font-family:var(--display);font-size:2.2rem;line-height:1}
/* tasks */

/* ================= SHEET (shared tracker) ================= */
async function getJSON(q){
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),8000);
  try{const r=await fetch(SHEET_URL+q,{signal:ctl.signal}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json()}
  finally{clearTimeout(tm)}
}
async function post(obj){
  if(DEMO) return {ok:true};
  const body=JSON.stringify(obj), h={"Content-Type":"text/plain;charset=utf-8"};
  try{const r=await fetch(SHEET_URL,{method:"POST",headers:h,body}); try{return await r.json()}catch(e){return {ok:true}}}
  catch(e){await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:h,body}); return {ok:true}}
}
function queueAdd(it){if(DEMO)return;const q=store.get("queue",[]).filter(x=>!(x.c===it.c&&String(x.s)===String(it.s)&&x.n===it.n&&x.k===it.k));q.push(it);store.set("queue",q)}
async function flush(){
  const q=store.get("queue",[]); if(!q.length) return;
  const left=[];
  for(const it of q){try{await post(it)}catch(e){left.push(it)}}
  store.set("queue",left);
  if(!left.length) toast("Saved ticks sent to the Sheet");
}
async function sendTick(c,s,n,k,v){
  if(DEMO) return false;
  const it={c,s,n,k,v};
  if(!SHEET_URL || NET===false){queueAdd(it); return false}
  try{await post(it); return true}catch(e){queueAdd(it); setNet(false); return false}
}
function syncChip(){
  if(DEMO) return `<span class="sync off" data-sync title="Demo mode: nothing is sent">${ic("demo","sm")}<span class="st">Demo</span></span>`;
  if(NET===true) return `<span class="sync on" data-sync title="Ticks are saved in the shared Sheet">${ic("cloud","sm")}<span class="st">Connected</span></span>`;
  if(NET===false) return `<span class="sync off" data-sync title="Saved on this device only">${ic("device","sm")}<span class="st">This device</span></span>`;
  return `<span class="sync" data-sync>${ic("refresh","sm")}<span class="st">Checking…</span></span>`;
}
function setNet(v){
  NET=v;
  document.querySelectorAll("[data-sync]").forEach(el=>{const t=document.createElement("span");t.innerHTML=syncChip();el.replaceWith(t.firstChild)});
  document.querySelectorAll("[data-offnote]").forEach(el=>el.hidden=(v!==false));
}
async function connect(){
  if(DEMO){setNet(false);return}
  if(!SHEET_URL){setNet(false);return}
  try{
    const c=await getJSON("?a=config");
    if(c && c.classes && Object.keys(c.classes).length){
      const nc={classes:c.classes,open:c.open||{},next:c.next||{}};
      const changed = JSON.stringify(nc)!==JSON.stringify(CFG);
      SCRIPT_V=Number(c.v)||2; CFG=nc; store.set("cfg",CFG);
      SHEET_COUNTS=c.counts||null; SHEET_USAGE=c.usage||null; SHEET_ERR=c.err||"";
      setNet(true); flush();
      if(((changed && (ROUTE==="home"||ROUTE==="today")) || ROUTE==="mentor") && !(document.activeElement && document.activeElement.matches("input,textarea,select"))) render(ROUTE);
    } else setNet(false);
  }catch(e){setNet(false)}
}
async function loadTicks(c,s){
  if(DEMO){const b=store.get(mKey(c,s),{});const m=me();if(m.n){b[m.n]=Object.assign({},b[m.n]||{},store.get(tKey(c,m.n,s),{}))}return b}
  if(!SHEET_URL || NET===false) return null;
  if(SCRIPT_V && SCRIPT_V<6) return null; /* Google drops requests with a parameter named c: Script v6 reads cls/ses */
  try{return await getJSON(`?a=ticks&cls=${enc(c)}&ses=${enc(s)}`)}catch(e){return null}
}

function tasksFor(n){
  const t=[{k:"pre",w:"Before",t:"Watch the Pre-Session Video",u:L("Pre-Session Videos"),ty:"video"},
   {k:"tt",w:"During",t:"Three Takeaways",u:L("Three Takeaways"),ty:"form"},
   {k:"wk",w:n>=6?"During":"After",t:"Weekly Reflective Journal",u:L("Weekly Journal"),ty:"journal"}];
  if([4,8,12,16].includes(n)) t.push({k:"mo",w:n>=6?"During":"After",t:"Monthly Reflective Journal",u:L("Monthly Journal"),ty:"journal"});
  t.push({k:"pln",w:n>=7?"After":(n>=6?"During":"After"),t:n>=7?"Add your new PLN contribution (before the next session)":"Add your PLN contribution",u:L("Our PLN (Padlet)"),ty:"padlet"});
  t.push({k:"sr",w:"After",t:"Watch the Summary & Review video",sub:"Also in Teams › Class Work › Session "+n,u:VIDEOS[n]||PLAYLIST||"",ty:"video"});

const OTHER="__other";
const myOthers=k=>store.get("oth_"+k,[]);
function saveOther(k,v){v=String(v||"").trim(); if(!v) return; const a=myOthers(k).filter(x=>x.toLowerCase()!==v.toLowerCase()); a.unshift(v); store.set("oth_"+k,a.slice(0,8))}
const optVal=x=>typeof x==="string"?x:x.v;
const flatOpts=opts=>opts.flatMap(x=>x&&x.g?x.g.map(optVal):[optVal(x)]);
function pick(id,key,opts,label,cls,model,ph){
  const known=flatOpts(opts).map(x=>x.toLowerCase());
  const own=myOthers(key).filter(x=>!known.includes(x.toLowerCase()));
  const o=x=>typeof x==="string"?`<option value="${esc(x)}">${esc(x)}</option>`:`<option value="${esc(x.v)}">${esc(x.t||x.v)}</option>`;
  const body=opts.map(x=>x&&x.g?`<optgroup label="${esc(x.l)}">${x.g.map(o).join("")}</optgroup>`:o(x)).join("");
  return `<div class="field"><label for="${id}" class="${cls||""}">${label}</label>
  <select id="${id}" data-key="${key}">${ph?`<option value="">${esc(ph)}</option>`:""}${body}${own.length?`<optgroup label="My own words">${own.map(o).join("")}</optgroup>`:""}<option value="${OTHER}">Other (write your own)</option></select>
  <input id="${id}_o" class="othin" hidden placeholder="Write your own words here" aria-label="${esc(label.replace(/<[^>]+>/g,""))}: your own words" autocomplete="off">

}

function wirePick(id,onChange){

function verbCheck(v){
  const w=v.toLowerCase().trim();

  if(bad) return [false,`“${esc(bad)}” is not measurable. You cannot see it. Choose a verb you can see or hear: name, match, say, write…`];
  const lv=VERB_BANK[w]||VERB_BANK[w.split(" ")[0]];
  if(lv) return [true,`“${esc(w)}” is measurable (Bloom: ${lv}).`];
  return [null,`The app does not know “${esc(w)}”. Can you see or hear students do it? Use AI Try or ask your teacher.`];
}

const SB3=[{v:"alone",tog:false},{v:"in pairs, they talk",tog:false},{v:"together in one file or board",tog:true},{v:"they comment on each other's work",tog:true}];
const SB4=[{v:"only the teacher",out:false},{v:"our class",out:false},{v:"families",out:true},{v:"another class or school",out:true}];
const SYN={t:{q:"Does it add sound, pictures or instant feedback?"},h:{q:"Do students work together in one place, or comment on each other's work?"},w:{q:"Is it outside our class?"}};

 giving:["write sentences","one shared Word file","they comment on each other's work","our class"],healthy:["make a poster","Padlet","together in one file or board","our class"],
 city:["answer questions","a quiz with instant results (Kahoot, Forms)","alone","only the teacher"],metals:["answer questions","a quiz with instant results (Kahoot, Forms)","in pairs, they talk","our class"],
 villages:["make a poster","Book Creator or Canva","together in one file or board","families"],earth:["retell a story","a voice recorder (Vocaroo)","alone","families"],field:["write sentences","Padlet","they comment on each other's work","another class or school"]};
let samrYN={t:null,h:null,w:null};

function samrState(){
  const d=val("s1"),t=val("s2"),h=val("s3"),w=val("s4");
  const fT=SB2.find(x=>x.v===t),fH=SB3.find(x=>x.v===h),fW=SB4.find(x=>x.v===w);
  const add=fT?fT.add:(t?samrYN.t:null), tog=fH?fH.tog:(h?samrYN.h:null), out=fW?fW.out:(w?samrYN.w:null);
  let lv=null;
  if(t&&h&&w&&add!==null&&tog!==null&&out!==null) lv=!add?"S":out?"R":tog?"M":"A";
  return {d,t,h,w,add,tog,out,lv};
}
function drawYN(k,id){
  const box=$("#yn_"+k);
  if(!isOther(id)||!val(id)){box.innerHTML="";if(!isOther(id))samrYN[k]=null;return}
  const q=SYN[k],v=samrYN[k];
  box.innerHTML=`<div class="qcard"><b class="small">${q.q}</b><div class="yn"><button data-syn="${k}|1" class="${v===true?"on":""}">Yes</button><button data-syn="${k}|0" class="${v===false?"on":""}">No</button></div></div>`;
}
const SAMR_UP={S:["2","Teams Flashcards with sound","a tool that adds sound, pictures or instant feedback, e.g. Teams Flashcards with sound"],
  A:["3","together in one file or board","“together in one file or board” or “they comment on each other's work”"],
  M:["4","families","“families” or “another class or school”"]};
function drawSamr(){
  [["t","s2"],["h","s3"],["w","s4"]].forEach(([k,id])=>drawYN(k,id));
  const s=samrState();
  $("#sOut").innerHTML=s.d||s.t||s.h||s.w ? `Students ${esc(s.d||"___")} using ${esc(s.t||"___")}, ${esc(s.h||"___")}. Who sees or hears it: ${esc(s.w||"___")}.` : `<span class="muted">Choose the four boxes. Your activity appears here.</span>`;
  $("#sLad").innerHTML=samrLadderSVG(s.lv,false);
  if(!s.lv){
    const miss=[!s.d&&"1",!s.t&&"2",!s.h&&"3",!s.w&&"4"].filter(Boolean);
    const q=[s.t&&s.add===null&&"2",s.h&&s.tog===null&&"3",s.w&&s.out===null&&"4"].filter(Boolean);
    $("#sLvl").innerHTML=`<p class="note">${ic("info","sm")}<span>${miss.length?`Choose box ${miss.join(", ")}.`:""} ${q.length?`Answer Yes or No under box ${q.join(", ")}.`:""}</span></p>`;
    $("#sWhy").innerHTML="";$("#sUp").innerHTML="";
  } else {
    const r=SAMR_RUNG[s.lv];
    $("#sLvl").innerHTML=`<div class="lvl" style="background:${r[3]}"><b class="big">${s.lv}</b><div><b>${r[0]}</b><p class="small">${r[1]}</p></div></div>`;
    $("#sWhy").innerHTML=`<span class="label">Why?</span>`+checks([
      [s.add,s.add?`Box 2: ${esc(s.t)} adds sound, pictures or instant feedback.`:`Box 2: ${esc(s.t)} adds nothing. Paper can do the same.`],
      [s.tog,s.tog?`Box 3: students work together or comment. The task changes.`:`Box 3: students work ${esc(s.h)}. The task stays the same.`],
      [s.out,s.out?`Box 4: ${esc(s.w)} see or hear it. A real audience outside the class.`:`Box 4: ${esc(s.w)}: the work stays inside our class.`]]);
    const up=SAMR_UP[s.lv];
    $("#sUp").innerHTML= up ? `<div class="tip"><b>Raise it one step:</b> change box ${up[0]} to ${up[2]}. <button class="linkb" id="sRaise">Show me</button></div>`
      : `<div class="tip"><b>Top step.</b> Well done. Keep a Plan B on paper ready.</div>`;
    const rb=$("#sRaise"); if(rb) rb.onclick=()=>{setPick("s"+up[0],up[1]);drawSamr();toast("Changed box "+up[0]+". Look at the ladder.")};
  }
  document.querySelectorAll("[data-syn]").forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.syn.split("|");samrYN[k]=v==="1";drawSamr()});
  aiNote("sAI",["s1","s2","s3","s4"].some(isOther));

}
const samrText=()=>{const s=samrState();return `My activity: Students ${s.d} using ${s.t}, ${s.h}. Who sees or hears it: ${s.w}.`+(s.lv?`\nSAMR level: ${s.lv} (${SAMR_RUNG[s.lv][0]})`:"")};
function wireSamr(){
  ["s1","s2","s3","s4"].forEach(i=>wirePick(i,()=>{if(i!=="s1"){const k={s2:"t",s3:"h",s4:"w"}[i];if(!isOther(i))samrYN[k]=null;}drawSamr()}));
  const fill=a=>{samrYN={t:null,h:null,w:null};a.forEach((v,i)=>setPick("s"+(i+1),v));drawSamr()};
  $("#sEx").onclick=()=>{fill(SAMR_EX[TOPIC[current()]]||SAMR_EX.food);toast("Example filled. Now change it for your lesson.")};
  $("#sClr").onclick=()=>fill(["","","",""]);
  $("#sCopy").onclick=()=>{const s=samrState();if(!s.lv){toast("Choose the four boxes first");return}copy(samrText());logUse("samr","copy:"+s.lv)};
  wireAI("sAI",()=>AIP("This is my classroom activity. Which SAMR level is it (Substitution, Augmentation, Modification or Redefinition)? Show me how to raise it one level.",samrText()),()=>{
    const s=samrState();
    if(!s.lv){const miss=[!s.d&&"1",!s.t&&"2",!s.h&&"3",!s.w&&"4"].filter(Boolean);
      const tips={"1":"Box 1: say what students do, e.g. match words and pictures.","2":"Box 2: choose the tool. Ask: does it add sound, pictures or ✓ / ✗?","3":"Box 3: how do students work? Together in one place changes the task.","4":"Box 4: who sees the work? Families or another class make it a real audience."};
      return {vis:samrLadderSVG(null,false),tip:miss.length?tips[miss[0]]:"Answer the Yes / No question under your own words.",ex:"Students match food words using Teams Flashcards with sound, alone. Our class sees it → A."}}
    const up=SAMR_UP[s.lv], nxt={S:"A",A:"M",M:"R"}[s.lv];

    return {vis:samrLadderSVG(s.lv,false,nxt),tip:`You are at <b>${s.lv}</b>. The dashed step is <b>${nxt}</b>: change box ${up[0]}.`,ex:esc(up[2])};
  });
  fill(SAMR_EX[TOPIC[current()]]||SAMR_EX.food);
}

function redefState(){const i=val("r1"),x=$("#rX").value.trim(),a=val("r2"),p=val("r3");const fa=RAUD.find(z=>z.v===a);const out=fa?fa.out:(a?redefYN:null);return {i,x,a,p,out}}

const CHEERS=["Great job!","Well done!","One more step!","Super!","You did it!","Keep going!"];
function starSVG(cls="bigstar"){return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC.star.match(/d="([^"]+)"/)[1]}" fill="var(--accent)" stroke="#8a5a00" stroke-width="1.2" stroke-linejoin="round"/></svg>`}
function confetti(){
  try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return}catch(e){}
  const c=document.createElement("div");c.className="confetti";const cols=["#f7c04a","#f08a5d","#2f6fb2","#1f8a5b","#8a4fb5","#c0621a","#e0a526"];
  for(let i=0;i<70;i++){const p=document.createElement("i");p.style.left=(Math.random()*100)+"vw";p.style.background=cols[i%cols.length];p.style.animationDelay=(Math.random()*.5)+"s";p.style.animationDuration=(1.8+Math.random()*1.2)+"s";c.appendChild(p)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),3400);
}
function tickSnd(){
  if(store.gget("snd","1")==="0") return;
  try{const C=window.AudioContext||window.webkitAudioContext,a=window._ac||(window._ac=new C());const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
    o.type="square";o.frequency.value=1400;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.05)}catch(e){}
}
function ding(big){
  if(store.gget("snd","1")==="0") return;
  try{const C=window.AudioContext||window.webkitAudioContext,a=window._ac||(window._ac=new C());a.resume&&a.resume();
    (big?[523.25,659.25,783.99,1046.5]:[659.25,987.77]).forEach((f,i)=>{const t=a.currentTime+i*(big?.14:.11),o=a.createOscillator(),g=a.createGain();
      o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+(big?.45:.3));
      o.connect(g).connect(a.destination);o.start(t);o.stop(t+.5)})}catch(e){}
}
function celebrate(s){
  confetti();
  const d=document.createElement("div");d.className="cheer";d.setAttribute("role","dialog");d.setAttribute("aria-label","Session complete");
  d.innerHTML=`<div class="box">${starSVG()}<h2>Session ${s} complete!</h2><p>All tasks are done. You earned a star on your Growth Path.</p><div class="row" style="justify-content:center"><button class="btn" data-go="tool:growth">${ic("award","sm")}My Growth Path</button><button class="btn alt" data-close>Close</button></div></div>`;
  document.body.appendChild(d);
  const close=()=>d.remove(); d.querySelector("[data-close]").onclick=close; d.addEventListener("click",e=>{if(e.target===d||e.target.closest("[data-go]"))close()});
  d.querySelector("[data-close]").focus();
}

function wireTasks(){

  const fbk=(c,n,s)=>{const el=$("#tFb");if(!el)return;const st=store.get(tKey(c,n,s),{}),req=required(tasksFor(s)),miss=req.filter(t=>!truthy(st[t.k])),r=req.length?Math.round(100*(req.length-miss.length)/req.length):0;
    const short=t=>TSHORT[t.k]||t.t, note=store.get(`note|${c}|${n}|${s}`,"");
    const msg=r===100?["g","award",`Excellent, ${esc(n)}! All Session ${s} tasks are done. ⭐`]:r>=50?["y","star",`Good progress, ${esc(n)}! Still to do: ${esc(miss.map(short).join(", "))}.`]:["b","compass",`You can do it, ${esc(n)}! Start with: ${esc(short(miss[0]))}.`];

    $("#tList").querySelectorAll("input[type=checkbox]").forEach(i=>i.onchange=()=>{const k=i.id.slice(2);const o=store.get(tKey(c,n,s),{});const was=sessionDone(c,n,s);o[k]=i.checked;store.set(tKey(c,n,s),o);
      const r=paintBar(c,n,s); fbk(c,n,s);
      if(i.checked){const b=document.createElement("span");b.className="burst";b.innerHTML="<span>⭐</span><span>✨</span><span>⭐</span><span>✨</span><span>⭐</span>";i.parentElement.appendChild(b);setTimeout(()=>b.remove(),1000);const sb=document.createElement("span");sb.className="starbig";sb.textContent="⭐";i.parentElement.appendChild(sb);setTimeout(()=>sb.remove(),1200);
        toast(CHEERS[Math.floor(Math.random()*CHEERS.length)]+" ✓");
        if(r.d===r.all && was.d<was.all){ding(true);setTimeout(()=>celebrate(s),500)}else ding(false);
        const tt=tasksFor(s).find(x=>x.k===k); if(tt&&tt.w==="During") autoAtt(s);}
      sendTick(c,s,n,k,i.checked); lastActive(c,n,s)});
  };
  const classBar=(c,s,data)=>{
    const nm=names(c); if(!data||!nm.length){$("#tCls").hidden=true;return}
    const r=required(tasksFor(s)); let tot=0;
    nm.forEach(n=>{const x=data[n]||{};tot+=r.filter(t=>truthy(x[t.k])).length});
    const p=Math.round(100*tot/(r.length*nm.length));
    $("#tCls").hidden=false;$("#tCBar").style.width=p+"%";$("#tCTxt").textContent=`Our class has done ${p}% of the Session ${s} tasks. Every tick helps!`;
  };

    if(my!==token || !data) return;
    if(!DEMO){const mine=data[n]; if(mine){
      const o=store.get(tKey(c,n,s),{});

function getapp(){
  return `${topbar()}${backBtn()}<div class="panel"><div class="head"><span class="hico" style="background:var(--ink);color:var(--bg)">${ic("qr")}</span><div><span class="label">Get the app</span><h1>Scan, add, open</h1></div></div>

   <div class="two"><div class="qcard"><b>Android (Chrome)</b><ol class="steps2"><li>Open the link in Chrome.</li><li>Tap <b>⋮</b> (top right).</li><li>Tap <b>Add to Home screen</b>.</li><li>Tap <b>Add</b>.</li></ol></div>
   <div class="qcard"><b>iPhone (Safari)</b><ol class="steps2"><li>Open the link in Safari.</li><li>Tap <b>Share</b> (the square with an arrow).</li><li>Tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol></div></div>
   <span class="label">${ic("teams","sm")} Add the app as a tab in Teams (instructor)</span>
   <div class="qcard"><ol class="steps2"><li>Open the channel <b>General</b>.</li><li>Tap <b>+</b> (Add a tab) at the top.</li><li>Choose <b>Website</b>.</li><li>Tab name: <b>${esc(APP.name)}</b></li><li>URL: paste the link above.</li><li>Tap <b>Save</b>.</li></ol></div>
   <div class="row" style="justify-content:center">${appIcon("g").replace('<svg ','<svg style="width:96px;height:96px" ')}</div>
   <p class="small muted" style="text-align:center">The app icon: three TPACK spheres (Technology, Pedagogy, Content) at the centre of a learning network.</p></div>`;
}
/* ---------- Privacy & Data ---------- */
function privacy(){
  const rows=[["device","On this phone only","Your name choice, ticks, your own words, agency moments, stars, tools tried, large text. Nobody else sees them."],
    ["cloud","In your teacher's Google Sheet","Your first name, your ticks, your own words in “Other”, the tools you open, your saved agency moments. Only your teacher can open the Sheet."],
    ["shield","In reports for the study","Codes only (S1, S2, …). No names."],
    ["ai","AI tools","The app never sends anything to AI. When you use AI Try, you paste the prompt yourself. Never paste names or personal information."],
    ["lock","Never","No passwords, no phone numbers, no photos."]];
  return `${topbar()}${backBtn()}<div class="panel"><div class="head"><span class="hico" style="background:var(--teach)">${ic("shield")}</span><div><span class="label">Privacy &amp; Data</span><h1>What the app saves</h1></div></div>
   <div class="list">${rows.map(r=>`<div class="moment">${ic(r[0])}<div class="stack" style="gap:2px"><b>${r[1]}</b><span class="small">${r[2]}</span></div></div>`).join("")}</div>
   <div class="tip small"><b>Demo mode</b> uses a sample class (Student A–I). Nothing is sent.</div>
   <button class="btn alt" id="pvClear">${ic("refresh","sm")}Clear my data on this phone</button>
   <p class="small muted">Clearing removes your data on this phone only. Ticks already in your teacher's Sheet stay there.</p></div>`;
}
/* ---------- Report a problem ---------- */
function report(){
  return `${topbar()}${backBtn()}<div class="panel" id="repp"><div class="head"><span class="hico" style="background:var(--check)">${ic("bug")}</span><div><span class="label">Help</span><h1>Report a problem</h1></div></div>
   ${guide(["Choose the problem","Say where (one line)","Copy and post it"])}
   ${pick("rpK","prob_kind",PROBLEMS,"What is the problem?","","Model: <i>A link does not open</i>")}
   <div class="field"><label for="rpW">Where? What did you tap?</label><input id="rpW" placeholder="My Tasks › Session 5 › Open (Weekly Journal)" autocomplete="off"><span class="model">${ic("bulb","sm")}<span>Model: <i>My Tasks › Session 5 › the Open link of the Weekly Journal</i></span></span></div>
   <div class="out small" id="rpOut"></div>
   <div class="row"><button class="btn" id="rpCopy">${ic("copy","sm")}Copy</button><a class="lk" id="rpWA" href="https://wa.me/" target="_blank" rel="noopener">${ic("msg","sm")}Send in WhatsApp</a><a class="lk" href="${esc(L("Activities & Questions"))}" target="_blank" rel="noopener">${ic("teams","sm")}Post in Teams</a></div>
   <p class="small muted">WhatsApp: choose your teacher or the class group, then send. Teams: paste it as a reply under “Questions (all sessions)”.</p></div>`;
}
function wireReport(){
  const f=()=>{const t=`Problem in ${APP.name} v${APP.version}: ${val("rpK")||"___"}\nWhere: ${$("#rpW").value.trim()||"___"}\nScreen: ${ROUTE_PREV||"home"} · ${window.innerWidth}×${window.innerHeight} · ${/iphone|ipad/i.test(navigator.userAgent)?"iPhone":/android/i.test(navigator.userAgent)?"Android":"Computer"}`;$("#rpOut").innerText=t;const wa=$("#rpWA");if(wa)wa.href="https://wa.me/?text="+enc(t);return t};
  wirePick("rpK",f);$("#rpW").addEventListener("input",f);f();
  $("#rpCopy").onclick=()=>{copy(f(),"Copied. Paste it in Activities & Questions.");logUse("report",isOther("rpK")?"own":val("rpK"))};
}

/* ---------- Demo mode (examiners; sample class on this device only) ---------- */
function enterDemo(){
  DEMO=true; store.gset("demo","1");
  const nm=DEMO_CFG.classes[DEMO_CLASS];
  if(!store.get("seeded",false)){
    for(let s=5;s<=8;s++){const tk=required(tasksFor(s)),b={};
      nm.forEach((n,i)=>{const r={att:(i+s)%7!==0,mt:(i+s)%3===0};tk.forEach((t,j)=>{r[t.k]=s<8?((i*3+j*5+s)%9)<7:((i+j)%4)<2});if(i===0&&s<8)tk.forEach(t=>r[t.k]=true);b[n]=r});
      b[nm[1]].note="Great PLN contribution";b[nm[4]].note="Weekly Journal missing";
      store.set(mKey(DEMO_CLASS,s),b);
      const mine={};tk.forEach(t=>mine[t.k]=b[nm[0]][t.k]);store.set(tKey(DEMO_CLASS,nm[0],s),mine);}
    store.set("me",{c:DEMO_CLASS,n:nm[0]}); store.set("toured",true); store.set("used",["abcd","samr","tasks","growth"]);
    store.set("agency",[{d:"P",t:"The internet stopped, so I used my picture cards and the game went on.",s:8,dt:todayISO()},{d:"F",t:"Next year I will make a class Padlet for my students' families.",s:7,dt:todayISO()}]);
    store.set("seeded",true);
  }
  CFG=DEMO_CFG; NET=false; mentorOn=true; render("home"); toast("Program map: a sample class on this device");
}
function exitDemo(){
  DEMO=false; store.gset("demo",null); mentorOn=false;
  CFG=store.get("cfg",{classes:{[DEFAULT_CLASS]:DEFAULT_NAMES},open:{[DEFAULT_CLASS]:RELEASED_UP_TO},next:{}}); NET=null; render("home"); connect();
}

function wirePrac(id,items,name){
  document.querySelectorAll(`[data-px^="${id}|"]`).forEach(b=>b.onclick=()=>{const [,i,k]=b.dataset.px.split("|"),p=items[+i],ok=k===p.a;

}

TOOL_WIRE.picker=()=>{
  const own=()=>namesFrom(store.get("pk_names",""));
  const useOwn=()=>store.get("pk_own",false)&&own().length>1;
  const list=()=>useOwn()?own():names(myClass());
  const key=()=>"pk_used|"+(useOwn()?"own":myClass());
  let used=store.get(key(),[]), base=store.get("pk_base",0), busy=false;
  const seg=()=>360/Math.max(1,list().length);
  const draw=()=>{const L=list(),n=L.length,g=$("#pkRot");if(!g)return;
    if(!n){g.innerHTML=`<text text-anchor="middle" y="5" font-size="12">No names</text>`;return}
    const r=100,sg=360/n,pt=a=>[r*Math.cos(a*Math.PI/180),r*Math.sin(a*Math.PI/180)];
    g.innerHTML=L.map((nm,i)=>{const a0=-90+i*sg,a1=a0+sg,[x0,y0]=pt(a0),[x1,y1]=pt(a1),mid=a0+sg/2,big=sg>180?1:0,u=used.includes(nm);
      const path=n===1?`<circle r="${r}" fill="${WCOL[0]}"/>`:`<path d="M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${WCOL[i%WCOL.length]}" opacity="${u?.35:1}" stroke="#fff" stroke-width="2"/>`;
      const fs=n>12?9:n>9?11:13;
      return path+`<text transform="rotate(${mid.toFixed(2)}) translate(62 0)" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-weight="800" fill="#fff" style="font-family:var(--display)">${esc(nm.length>12?nm.slice(0,11)+"…":nm)}</text>`}).join("");
    g.style.transform=`rotate(${base}deg)`;
    const left=L.filter(x=>!used.includes(x));$("#pkLeft").textContent=`${left.length} of ${n} names left`+(useOwn()?" · your own names":" · "+myClass());
    $("#pkDone").textContent=used.length?"Picked: "+used.join(", "):"";};
  const spin=()=>{if(busy)return;const L=list();if(!L.length){toast("No names yet");return}
    let left=L.filter(x=>!used.includes(x));if(!left.length){used=[];store.set(key(),used);left=L;toast("Everyone had a turn. New round!");draw()}
    const pick=left[Math.floor(Math.random()*left.length)],i=L.indexOf(pick),c=(i+.5)*seg();
    const target=base+360*5+((((-c-base)%360)+360)%360);
    busy=true;$("#pkBig").textContent="…";$("#pkBig").classList.remove("win");
    const g=$("#pkRot");g.style.transform=`rotate(${target}deg)`;
    let d=40,tt=0;const tk=()=>{if(!busy)return;tickSnd();tt+=d;d=Math.min(420,d*1.13);if(tt<3500)setTimeout(tk,d)};tk();
    setTimeout(()=>{busy=false;base=target%360;store.set("pk_base",base);
      g.style.transition="none";g.style.transform=`rotate(${base}deg)`;void g.getBoundingClientRect();g.style.transition="";
      used.push(pick);store.set(key(),used);draw();const big=$("#pkBig");big.textContent=pick;big.classList.add("win");ding(true);confetti();logUse("picker","spin")},3850)};
  $("#pkGo").onclick=spin;
  $("#pkClr").onclick=()=>{used=[];store.set(key(),[]);$("#pkBig").textContent="?";draw()};
  $("#pkN").value=store.get("pk_names","");
  $("#pkUse").onclick=()=>{const v=$("#pkN").value;store.set("pk_names",v);if(namesFrom(v).length<2){toast("Write at least two names");return}store.set("pk_own",true);used=store.get(key(),[]);draw();toast("Your names are on the wheel")};
  $("#pkCls").onclick=()=>{store.set("pk_own",false);used=store.get(key(),[]);draw();toast("Our class is on the wheel")};
  wireAI("pickerAI",()=>AIP("Give me three fair ways to choose students to answer in a big class.","[my class size]"),()=>({tip:"Ask the question first, then spin. All students think.",ex:"“What colour is the apple? … Mona!”"}));
  draw();
};

    if(lines.length && allDone.length) msg+=`\n\n🌟 All done: ${allDone.join(", ")}. Thank you!`;
    if(absent.length && absent.length<nm.length) msg+=`\n\nWe missed you: ${absent.join(", ")}. Please watch the Summary & Review video in Class Work.`;
    if(mt.length && mt.length<nm.length) msg+=`\n\nMini-Teach next time: ${mt.join(", ")}.`;
    if(notes.length) msg+=`\n\nA note for you:\n${notes.join("\n")}`;
    msg+=`\n\nOpen ${APP.name} › My Tasks for the links: ${APP_URL}\nThank you!`;
    {const y=window.scrollY; render("mentor"); window.scrollTo(0,y)} const o=$("#mOut"); o.hidden=false; o.value=msg; o.select(); copy(msg,"WhatsApp reminder copied. Paste it in WhatsApp.")};
  $("#mSug").onclick=async()=>{
    if(!DEMO){const ok=await mLoad(cc,s); if(!ok){toast("Could not reach the Sheet: no notes suggested",3000);return}}
    const b=get(), req=tk.filter(t=>t.w!=="Optional"); let k=0;
    nm.forEach(n=>{const r=b[n]||{}; if(r.note) return;
      const miss=req.filter(t=>!truthy(r[t.k])).map(t=>t.k);
      const v=!present(r.att)&&miss.length===req.length?"Absent: please watch the Summary & Review video":!miss.length?"Finished all tasks on time":miss.includes("wk")?"Weekly Journal missing":miss.includes("pln")?"PLN contribution missing":miss.includes("pre")?"Pre-session video not watched":"Tasks late";
      b[n]=b[n]||{}; b[n].note=v; sendTick(cc,s,n,"note",v); k++});
    put(b); {const y=window.scrollY; render("mentor"); window.scrollTo(0,y)} toast(k?`${k} notes suggested and saved. Change any note in its menu.`:"Every student already has a note",3500)};
  $("#mCSV").onclick=()=>{const b=get(),o=$("#mOut");o.hidden=false;
    const q=v=>{v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    o.value=["Code,att,mt,"+tk.map(t=>t.k).join(",")+",agency,note"].concat(nm.map((n,i)=>{const r=b[n]||{};return ["S"+(i+1),present(r.att)?1:0,truthy(r.mt)?1:0,...tk.map(t=>truthy(r[t.k])?1:0),r.agency?1:0,q(r.note||"")].join(",")})).join("\n");
    o.select();copy(o.value)};
  const dl=(name,text,type)=>{try{const u=URL.createObjectURL(new Blob(["\ufeff"+text],{type:type||"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500);toast("Saved in Downloads: "+name,3500)}catch(e){copy(text,"Copied (download not allowed here)")}};
  const pad=x=>String(x).padStart(2,"0");
  const repText=()=>{const b=get(),N=nm.length||1,pc=k=>Math.round(100*nm.filter(n=>truthy((b[n]||{})[k])).length/N);
    const code=n=>"S"+(nm.indexOf(n)+1), nb=n=>(b[n]||{}).note||"";
    const grp=kind=>nm.filter(n=>noteKind(nb(n))===kind).map(n=>`  ${code(n)}: ${nb(n)}`).join("\n")||"  none";
    return [`Session Report · ${APP.name}`,`Class: ${cc} · Session ${s}: ${SESSIONS[s]} · ${todayISO()}`,
      `Present: ${nm.filter(n=>present((b[n]||{}).att)).length} of ${nm.length}`,`Mini-Teach turns done: ${nm.filter(n=>truthy((b[n]||{}).mt)).length}`,
      `Tasks done:`,...tk.map(t=>`  ${t.t}: ${pc(t.k)}%`),`Agency moments saved: ${nm.filter(n=>(b[n]||{}).agency).length}`,`Positive notes:`,grp("P"),`Needs work:`,grp("N"),`Other notes:`,grp("O"),`(Codes S1–S${nm.length} only.)`].join("\n")};
  const sLine=()=>{const b=get(),N=nm.length,cnt=k=>nm.filter(n=>truthy((b[n]||{})[k])).length;
    const sc=nm.map(n=>String((b[n]||{}).gscore||"")).filter(x=>/^\d+\/\d+$/.test(x)).map(x=>{const [a,z]=x.split("/").map(Number);return [a,z]});
    const avg=sc.length?(sc.reduce((p,q)=>p+q[0],0)/sc.length).toFixed(1)+"/"+sc[0][1]:"—";
    return `Session ${s} · ${todayISO()} · present ${nm.filter(n=>present((b[n]||{}).att)).length}/${N} · Three Takeaways ${cnt("tt")}/${N} · Weekly ${cnt("wk")}/${N}${tk.some(t=>t.k==="mo")?` · Monthly ${cnt("mo")}/${N}`:""} · PLN ${cnt("pln")}/${N} · game average ${avg} (${sc.length} played) · agency moments ${nm.filter(n=>(b[n]||{}).agency).length}/${N} (codes only)`};
  $("#mLine").onclick=async()=>{if(!DEMO){const ok=await mLoad(cc,s); if(!ok){toast("Could not reach the Sheet: the line may be old",3000)}} const o=$("#mOut");o.hidden=false;o.value=sLine();o.select();copy(o.value,"Session line copied. Paste it in the Session Log.")};
  $("#mRepDl").onclick=async()=>{if(!DEMO) await mLoad(cc,s); dl(`Session_${pad(s)}_Report_codes.txt`,repText())};
  $("#mAll").onclick=async()=>{const top=openUpTo(cc), keys=["att","mt","pre","tt","wk","mo","pln","sr","game","fc","ai"], rows=["Session,Code,"+keys.join(",")+",gscore,agency,note_type"];
    $("#mStat").textContent="Loading all sessions…";
    for(let x=1;x<=top;x++){ if(!DEMO) await mLoad(cc,x); const b=store.get(mKey(cc,x),{});
      nm.forEach((n,i)=>{const r=b[n]||{};rows.push([x,"S"+(i+1),...keys.map(k=>k==="att"?(present(r.att)?1:0):(truthy(r[k])?1:0)),r.gscore||"",r.agency?1:0,{P:"positive",N:"needs work",O:"other"}[noteKind(r.note||"")]||""].join(","))})}
    $("#mStat").textContent="All sessions exported (codes only).";
    dl(`All_Sessions_1-${top}_codes.csv`,rows.join("\n"),"text/csv;charset=utf-8")};
  $("#mRep").onclick=()=>{const b=get(),N=nm.length||1,pc=k=>Math.round(100*nm.filter(n=>truthy((b[n]||{})[k])).length/N);
    const code=n=>"S"+(nm.indexOf(n)+1), nb=n=>(b[n]||{}).note||"";
    const grp=kind=>nm.filter(n=>noteKind(nb(n))===kind).map(n=>`  ${code(n)}: ${nb(n)}`).join("\n")||"  none";
    copy([`Session Report · ${APP.name}`,`Class: ${cc} · Session ${s}: ${SESSIONS[s]} · ${todayISO()}`,
      `Present: ${nm.filter(n=>present((b[n]||{}).att)).length} of ${nm.length}`,`Mini-Teach turns done: ${nm.filter(n=>truthy((b[n]||{}).mt)).length}`,
      `Tasks done:`,...tk.map(t=>`  ${t.t}: ${pc(t.k)}%`),`Agency moments saved: ${nm.filter(n=>(b[n]||{}).agency).length}`,`Positive notes:`,grp("P"),`Needs work:`,grp("N"),`Other notes:`,grp("O"),`(Codes S1–S${nm.length} only.)`].join("\n"))};
  const showCounts=d=>{const el=$("#mCnt"); if(!el) return;
    if(d===null){el.innerHTML=`<p class="small warn">The app could not read the tool list from the Sheet.</p><button class="btn alt" id="mDiag">${ic("search","sm")}Show the Sheet answer</button><pre id="mDiagOut" class="out small" style="white-space:pre-wrap;overflow-wrap:anywhere" hidden></pre>`;
      $("#mDiag").onclick=async()=>{const o=$("#mDiagOut");o.hidden=false;o.textContent="Asking the Sheet…";
        const lines=[`Class: ${cc} · Script v${SCRIPT_V}${SHEET_ERR?" · "+SHEET_ERR:""}`];
        for(const [n,q] of [["config","?a=config"],["ticks",`?a=ticks&cls=${enc(cc)}&ses=5`],["counts",`?a=counts&cls=${enc(cc)}`]]){
          try{const r=await fetch(SHEET_URL+q);const t=await r.text();lines.push(`${n}: OK ${r.status} · ${t.slice(0,80)}`)}catch(e){lines.push(`${n}: FAILED (${e.message})`)}}
        o.textContent=lines.join("\n")};return}
    if(!Object.keys(d).length){el.innerHTML=`<p class="small muted">No tool use yet for <b>${esc(cc)}</b>. It fills when students open tools from the GitHub link.</p>`;return}
    const rows=Object.entries(d).map(([k,v])=>[(TOOLS.find(t=>t.id===k)||{}).t||({ai:"AI Try",hint:"Give me a hint",thanks:"Thank a classmate",report:"Report a problem"}[k]||k),v.n,v.students]).sort((a,b)=>b[1]-a[1]);
    el.innerHTML=`<div class="gridwrap"><table style="min-width:320px"><tr><th>Tool</th><th>Uses</th><th>Students</th></tr>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div><p class="small muted">Students = how many different students (no names).</p>`;
    const cb=$("#mCntCopy");cb.hidden=false;cb.onclick=()=>copy(["Tool\tUses\tStudents",...rows.map(r=>r.join("\t"))].join("\n"),"Table copied. Paste it in Word or Excel.")};
  if(!DEMO && SHEET_COUNTS) showCounts(SHEET_COUNTS[cc]||{});
  else if(DEMO) showCounts({abcd:{n:31,students:9},tasks:{n:58,students:9},samr:{n:17,students:7},growth:{n:22,students:8},agency:{n:12,students:6},ai:{n:9,students:5},hint:{n:14,students:6}});
  else if(SCRIPT_V>=4) loadCounts(cc).then(showCounts);
  if(SCRIPT_V>=3 && !DEMO) (SHEET_USAGE?Promise.resolve(SHEET_USAGE[cc]||{}):loadUsage(cc)).then(d=>{const el=$("#mOth"); if(!el) return;
    if(!d||!Object.keys(d).length){el.innerHTML=`<p class="small muted">No own words yet.</p>`;return}
    el.innerHTML=Object.entries(d).map(([k,list])=>`<p class="small"><b>${esc(OTHER_NAMES[k]||k)}:</b> ${list.map(([v,c])=>`${esc(v)} (${c})`).join(" · ")}</p>`).join("")});
  if(DEMO){const el=$("#mOth");if(el)el.innerHTML=`<p class="small"><b>ABCD · Verb:</b> point and say (3) · act out the words (2)</p><p class="small"><b>SAMR · Tool:</b> Wordwall (2)</p>`}
  $("#mOpenGo").onclick=async()=>{const v=+$("#mOpen").value;CFG.open=CFG.open||{};CFG.open[cc]=v;if(!DEMO)store.set("cfg",CFG);
    if(DEMO||NET===false||!SHEET_URL){toast(DEMO?"Demo: opened on this device":"Saved on this device. Change the Settings sheet so students see it.");render("mentor");return}
    try{const r=await post({a:"open",pin:MENTOR.pin,c:cc,s:v});toast(r&&r.ok===false?"The Sheet refused the PIN":`Sessions 1–${v} are open for ${cc}`)}catch(e){toast("Could not reach the Sheet. Change the Settings sheet.")}
    render("mentor")};
  const onx=$("#mOpenNext");if(onx)onx.onclick=()=>{$("#mOpen").value=String(Math.min(openUpTo(cc)+1,18));$("#mOpenGo").click()};
  $("#mNextGo").onclick=async()=>{const v=$("#mNext").value;CFG.next=CFG.next||{};CFG.next[cc]=v;if(!DEMO)store.set("cfg",CFG);
    if(DEMO||SCRIPT_V<4||NET!==true){toast(DEMO?"Demo: saved on this device":"Saved on this device. With Script v4, students see it too (or write it in Settings, column C).");return}
    try{const r=await post({a:"next",pin:MENTOR.pin,c:cc,d:v});toast(r&&r.ok===false?"The Sheet refused the PIN":"Date saved for "+cc)}catch(e){toast("Could not reach the Sheet. Write it in Settings, column C.")}};
  $("#mPrev").onchange=e=>{store.set("preview",e.target.checked);render("mentor")};
  const off=$("#mOff"); if(off) off.onclick=()=>{mentorOn=false;render("home")};
  if(NET===true && !wireMentor._auto){wireMentor._auto=true;$("#mRef").click()}
}

/* ---------- Router ---------- */
let ROUTE_PREV="home";
function render(r){
  if(!NAVPOP && r!==ROUTE && ROUTE){try{history.pushState({r},"");NAVD++}catch(e){}}
  NAVPOP=false;
  ROUTE_PREV=ROUTE; ROUTE=r;
  const app=$("#app"); let html="";
  const [kind,arg,arg2]=r.split(":");
  if(kind==="home") html=home();
  else if(kind==="search") html=searchScreen();
  else if(kind==="sec") html=section(arg);
  else if(kind==="card") html=isOpenS((CARDS.find(x=>x.id===arg)||{}).s)?card(arg):lockCard(arg);
  else if(kind==="lockc") html=lockCard(arg);
  else if(kind==="pv") html=preview(arg);
  else if(kind==="about") html=about(); else if(kind==="news") html=news(); else if(kind==="tour") html=tour();
  else if(kind==="start") html=start(); else if(kind==="today") html=today();
  else if(kind==="gloss") html=gloss(); else if(kind==="getapp") html=getapp(); else if(kind==="privacy") html=privacy();
  else if(kind==="report") html=report(); else if(kind==="matrix") html=matrix();
  else if(kind==="mentor") html=mentor();
  else if(kind==="game") html=gameScreen(+arg,+(arg2||0));
  else if(kind==="tool"){
    const t=TOOLS.find(x=>x.id===arg);
    const V=Object.assign({abcd,tasks:tasksScreen,samr,redef,growth,agency:agencyScreen},TOOL_SCREENS);
    if(!t || !toolOpen(t) || !V[arg]) html=preview(arg); else {html=V[arg](); markUsed(arg); logUse(arg,"open"); if(t.s===current()) autoAtt(t.s)}
  }
  else html=home();
  if(kind==="home") store.set("fromTour",false);
  if(store.get("fromTour",false) && kind!=="start") html=html.replace('<div class="panel"',`<div class="tip noprint"><button class="btn alt" data-go="start">${ic("left","sm")}Back to Start here</button></div><div class="panel"`);
  app.innerHTML=html; window.scrollTo(0,0);
  app.querySelectorAll(".panel").forEach(wireVisual);
  wireInd();
  app.querySelectorAll(".quiz button").forEach(b=>b.onclick=()=>{const ok=b.dataset.j===b.dataset.a;b.classList.add(ok?"right":"wrong");b.textContent=(ok?"✓ ":"✗ ")+b.textContent.replace(/^[✓✗] /,"").replace(/ — (Yes!|Try again)$/,"")+(ok?" — Yes!":" — Try again")});
  if(kind==="home"||kind==="search") wireSearch();
  if(kind==="search"){const q=$("#q"); if(q) setTimeout(()=>q.focus(),50)}
  if(kind==="start") wireStart();
  if(kind==="mentor") wireMentor(); else {wireMentor._auto=false; clearInterval(MAUTO)}
  if(kind==="game") wireGame(+arg,+(arg2||0));
  if(kind==="report") wireReport();
  if(kind==="tool"){
    if($("#abcdp")) wireAbcd(); if($("#tList")) wireTasks(); if($("#samrp")) wireSamr();
    if($("#redefp")) wireRedef(); if($("#growp")) wireGrowth(); if($("#agp")) wireAgency();
    if(TOOL_WIRE[arg] && $("#"+arg+"p")) TOOL_WIRE[arg]();
  }
  if(kind==="card" && $("#sprac")) wireSprac();
  const cb=$("#citeCopy"); if(cb) cb.onclick=()=>copy($("#cite").innerText);
  const gc=$("#gaCopy"); if(gc) gc.onclick=()=>copy(APP_URL,"Link copied");
  const mx=$("#mxCopy"); if(mx) mx.onclick=()=>copy([MXH.join("\t"),...matrixRows().map(r=>r.join("\t"))].join("\n"),"Table copied. Paste it in Word.");
  const pc=$("#pvClear"); if(pc) pc.onclick=()=>{if(!pc.dataset.sure){pc.dataset.sure="1";pc.innerHTML=ic("refresh","sm")+"Tap again to clear";return}
    try{Object.keys(localStorage).filter(k=>k.startsWith(PFX())&&(DEMO||!k.startsWith("ctg_demo_"))).forEach(k=>localStorage.removeItem(k))}catch(e){}
    toast("Cleared on this phone"); if(DEMO) exitDemo(); else render("home")};
}
window.addEventListener("popstate",e=>{const r=(e.state&&e.state.r)||"home"; NAVD=Math.max(0,NAVD-1); NAVPOP=true; render(r)});
document.addEventListener("click",e=>{
  const bk=e.target.closest("[data-back]"); if(bk){e.preventDefault(); if(NAVD>0) history.back(); else render(bk.dataset.back); return}
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault(); if(g.hasAttribute("data-fromtour")) store.set("fromTour",true); else if(g.dataset.go!=="start" && ROUTE==="start") store.set("fromTour",false); render(g.dataset.go);return}
  const s=e.target.closest("[data-soon]"); if(s){toast(s.dataset.soon+": link coming soon");return}
  const l=e.target.closest("[data-listen]"); if(l){const t=$("#"+l.dataset.listen); if(t) speak(t.innerText.replace(/•/g,"")); return}
  if(e.target.closest("[data-bigtext]")){store.gset("size",store.gget("size","")==="lg"?null:"lg");applySize();render(ROUTE);return}
  if(e.target.closest("[data-demo-enter]")){enterDemo();return}
  if(e.target.closest("[data-demo-exit]")){exitDemo();return}
  if(e.target.closest("[data-print]")) window.print();
});
(()=>{const h=decodeURIComponent((location.hash||"").slice(1)); const r0=/^(game|tool|card|sec|today|start):?/.test(h)?h:"home"; ROUTE=""; try{history.replaceState({r:r0},"")}catch(e){} NAVPOP=true; render(r0)})();
connect();
window.addEventListener("hashchange",()=>{const h=decodeURIComponent((location.hash||"").slice(1)); if(/^(game|tool|card|sec|today|start):?/.test(h)) render(h)});
/* new version check (GitHub copy only) */
async function checkVersion(){
  if(inFrame||DEMO||!/github\.io$/.test(location.hostname)||$("#upd")) return;
  try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}); const t=await r.text(); const m=t.match(/version:"([\d.]+)"/);
    if(m&&m[1]!==APP.version){const b=document.createElement("button");b.id="upd";b.className="upd";b.innerHTML=ic("refresh","sm")+"New version of the app: tap to refresh";b.onclick=()=>location.reload();document.body.appendChild(b)}}catch(e){}
}
setTimeout(checkVersion,4000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") checkVersion()});
</script>
